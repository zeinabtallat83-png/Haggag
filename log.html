<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login||Haggag-Dental-care</title>
<style>
body{background:rgba(105, 128, 94, 0.925); font-family:sans-serif;
display:flex; justify-content:center; align-items:center; height:100vh; flex-wrap: wrap;}
.box{background:#fff; padding:25px; border-radius:20px;
    width:90%;max-width:350px; box-shadow:0 10px 30px #0001}
input{width:100%;padding:12px;margin:8px 0; border:1px solid #ddd;border-radius:10px}
button{width:100%;padding:12px;  background:rgba(105, 128, 94, 0.925);
    color:#fff;border:none; border-radius:10px;margin-top:10px; 
    cursor:pointer;font-size:16px}
a{color:#0a74da;text-decoration:none;font-size:14px}
.tabs{display:flex;gap:10px;margin-bottom:15px}
.tabs div{flex:1;text-align:center;padding:10px;
    border-radius:10px;cursor:pointer;background:#eee}
.tabs .active{background:rgba(105, 128, 94, 0.925);color:#fff}
</style>

</head>
<body>
    <div class="box">
<div class="tabs">
    <div id="t1" class="active" onclick="showTab('login')">تسجيل دخول</div>
    <div id="t2" onclick="showTab('reg')">حساب جديد</div>
</div>

<div id="loginForm">
    <input id="l_email" placeholder="رقم الموبايل أو الإيميل">
    <input id="l_pass" type="password" placeholder="كلمة السر">
    <button onclick="doLogin()">دخول</button>
  </div>

<div id="regForm" style="display:none">
    <input id="r_name" placeholder="الاسم بالكامل">
    <input id="r_phone" placeholder="رقم الموبايل">
    <input id="r_pass" type="password" placeholder="كلمة السر">
    <button onclick="doReg()">إنشاء حساب</button>
  </div>

  <br><a href="index.html">← رجوع للرئيسية</a>
</div>

<script>
function showTab(t){
  if(t=='login'){loginForm.style.display='block';
  regForm.style.display='none';
  t1.classList.add('active');
  t2.classList.remove('active')}
  else{loginForm.style.display='none';
  regForm.style.display='block';
  t2.classList.add('active');
  t1.classList.remove('active')}
};
function doReg(){localStorage.setItem ('user', JSON.stringify
({name:r_name.value, phone:r_phone.value, pass:r_pass.value}));
  alert('تم إنشاء الحساب! ادخل دلوقتي'); showTab('login');
};

function doLogin(){
  let u = JSON.parse(localStorage.getItem('user'));
  if(u && u.phone == l_email.value && u.pass == l_pass.value)
  {localStorage.setItem('logged','1'); 
  location.href='booking.html'}
  else alert('البيانات غلط - جرب تسجل حساب جديد الأول');
}
</script>
</body>
</html>
