<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجز موعد</title>
<style>
body{background:rgba(105,128,94,0.925);font-family:sans-serif;padding:20px}
.card{background:#fff;padding:20px;border-radius:15px;box-shadow:0 4px 15px #0001}
select,input,textarea{width:80%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px}
button{width:100%;padding:14px;background:rgba(105,128,94,0.925);color:#fff;border:none;border-radius:12px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<h2>مرحبا احجز معادك 🦷</h2>
<div class="card">
<label>نوع الخدمة</label>
<select id="service">
<option>زراعة أسنان</option>
<option>خلع جراحي</option>
<option>تجميل</option>
<option>كشف عادي</option>
<option>حشو عادي وعصب</option>
<option>تقويم</option>
</select>
<label>اليوم</label><input type="date" id="date">
<label>الوقت</label><input type="time" id="time">
<label>ملاحظات</label><textarea id="note" placeholder="اشتكي من ايه؟"></textarea>
<button onclick="book()">ارسال حجز واتساب</button>
</div>

<script>
function book(){
let service = document.getElementById('service').value;
let date = document.getElementById('date').value;
let time = document.getElementById('time').value;
let note = document.getElementById('note').value;

let msg = `حجز جديد من الموقع 🦷
الخدمة: ${service}
اليوم: ${date}
الساعة: ${time}
ملاحظة: ${note}`;

let whatsappLink = `https://wa.me/201090564323?text=${encodeURIComponent(msg)}`;
window.open(whatsappLink, '_blank');
}
</script>
</body>
</html>
